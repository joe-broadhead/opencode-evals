name: release

# Releases v<package.json version> as a git tag and a GitHub Release on a master commit CI passed. Started by hand:
#   gh workflow run release.yml --ref master -f sha=<master head CI passed>
# Nothing is built and nothing touches npm: evals has no dependencies and no build, so the tag is the release and
# `npm install --save-dev github:joe-broadhead/opencode-evals#v<version>` installs it.
#
# It runs only when dispatched on master: on any other ref, `wrong-ref` fails with the reason and nothing else runs.
# `plan` refuses before anything is written. The sha must be master's head, and CI must have passed on it. The version
# must be x.y.z and equal src/version.mjs. CHANGELOG.md needs a dated `## [x.y.z] - YYYY-MM-DD` heading. The tag must
# not exist yet, and the `release` environment must require a reviewer. One exception makes a re-run resumable: when the
# tag v<version> already points at this sha and no Release exists for it, the run creates only the Release. Every other
# case with an existing tag is refused. `publish` waits for the owner's approval of that environment. It then creates
# the tag on the sha (unless it is already there) and the Release with that CHANGELOG section. It runs no repository
# code.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: The full sha of the master head whose CI passed
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  wrong-ref:
    name: refuse a run off master
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Refuse
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::release.yml runs only on master: it was dispatched on $REF. Run: gh workflow run release.yml --ref master -f sha=<master head>"
          exit 1

  plan:
    name: plan the release
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - id: plan
        name: Plan, or refuse
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ "$GITHUB_REF" = "refs/heads/master" ] || fail "release.yml runs only on master, not $GITHUB_REF"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || fail "sha is not a full commit sha"
          [ "$(git rev-parse HEAD)" = "$SHA" ] || fail "checked out $(git rev-parse HEAD), not $SHA"
          head=$(gh api "repos/$REPO/commits/master" --jq .sha)
          [ "$head" = "$SHA" ] || fail "master's head is $head, not $SHA"
          ci=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&status=success" --jq .total_count)
          [ "$ci" -ge 1 ] || fail "no successful ci push run on $SHA"
          version=$(node -p 'require("./package.json").version')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "package.json version $version is not x.y.z"
          grep -qxF "export const VERSION = \"$version\"" src/version.mjs || fail "src/version.mjs does not say $version"
          grep -qE "^## \[${version//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || fail "CHANGELOG.md has no dated ## [$version] heading"
          # The tag: absent (a new release), or on this sha with no Release (a resumed run). Anything else is refused.
          # A lookup that fails for any reason other than 404 is refused too, never read as "absent".
          if ref=$(gh api "repos/$REPO/git/ref/tags/v$version" 2>"$RUNNER_TEMP/err"); then
            type=$(jq -r .object.type <<<"$ref"); target=$(jq -r .object.sha <<<"$ref")
            if [ "$type" = "tag" ]; then target=$(gh api "repos/$REPO/git/tags/$target" --jq .object.sha); fi
            [ "$target" = "$SHA" ] || fail "tag v$version exists on $target, not $SHA"
            if gh api "repos/$REPO/releases/tags/v$version" >/dev/null 2>"$RUNNER_TEMP/err"; then fail "tag v$version and its Release exist: nothing to do"; fi
            grep -q "HTTP 404" "$RUNNER_TEMP/err" || fail "could not look up the Release for v$version: $(cat "$RUNNER_TEMP/err")"
            mode=resume
          else
            grep -q "HTTP 404" "$RUNNER_TEMP/err" || fail "could not look up tag v$version: $(cat "$RUNNER_TEMP/err")"
            mode=new
          fi
          reviewers=$(gh api "repos/$REPO/environments/release" --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length' 2>/dev/null || echo 0)
          [ "$reviewers" -ge 1 ] || fail "the release environment requires no reviewer: add the owner as a required reviewer first"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version on $SHA ($mode)"

  publish:
    name: tag and release
    needs: plan
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Create the tag and the Release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
          MODE: ${{ needs.plan.outputs.mode }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          awk -v h="## [$VERSION] - " 'index($0, h) == 1 { on = 1; next } on && /^## \[/ { exit } on { print }' CHANGELOG.md > "$notes"
          [ -s "$notes" ] || { echo "::error::the CHANGELOG section for $VERSION is empty"; exit 1; }
          # Checked again after the approval: the tag must still be absent, or (resuming) still on this sha.
          if ref=$(gh api "repos/$REPO/git/ref/tags/v$VERSION" 2>"$RUNNER_TEMP/err"); then
            type=$(jq -r .object.type <<<"$ref"); target=$(jq -r .object.sha <<<"$ref")
            if [ "$type" = "tag" ]; then target=$(gh api "repos/$REPO/git/tags/$target" --jq .object.sha); fi
            [ "$MODE" = "resume" ] && [ "$target" = "$SHA" ] || { echo "::error::tag v$VERSION is on $target (planned: $MODE on $SHA)"; exit 1; }
            echo "tag v$VERSION is already on $SHA: creating only the Release"
          else
            grep -q "HTTP 404" "$RUNNER_TEMP/err" || { echo "::error::could not look up tag v$VERSION: $(cat "$RUNNER_TEMP/err")"; exit 1; }
            gh api "repos/$REPO/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$SHA" >/dev/null
          fi
          gh release create "v$VERSION" --repo "$REPO" --verify-tag --title "v$VERSION" --notes-file "$notes"
